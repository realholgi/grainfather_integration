# Grainfather Dashboard
# Requires Home Assistant 2026.11 or newer, the Grainfather integration,
# and Auto Entities for the dynamic history and metric cards.
# See the README's Example Dashboard section for setup.

title: Brewing

views:
  # ── Brew Sessions ────────────────────────────────────────────────────────────
  - title: Brew Sessions
    icon: mdi:beer
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:grainfather-brew-collection-card
            card_type: brew-session-detailed
            statuses: [planning, brewing, fermenting, conditioning, serving]
            sort_by: batch_number
            sort_direction: desc
            card_min_width: 360
            grid_options:
              columns: full
              rows: auto

  # ── Active Fermentations ─────────────────────────────────────────────────────
  # Label the fermentation hardware to populate the native automatic section.
  - title: Active Fermentations
    icon: mdi:thermometer
    type: sections
    max_columns: 2
    sections:
      - strategy:
          type: entities
          title: Fermentation Devices
          target:
            label_id: grainfather_fermentation
          entity_types: [sensor, number, select]
          include_config_and_diagnostic: true
      - type: grid
        column_span: 2
        cards:
          - type: custom:auto-entities
            show_empty: false
            card:
              type: history-graph
              title: Fermentation History (7 d)
              hours_to_show: 168
            card_param: entities
            filter:
              include:
                - attributes:
                    grainfather_entity_type: fermentation_device

  # ── Recipe & Metrics ─────────────────────────────────────────────────────────
  # Ready-made view for the recipe-metric / extra brew-session sensors, recipe
  # ingredients, and the fermentation-controller target temperature.
  # Uses auto-entities to pick up the sensors dynamically by entity_id pattern,
  # so it works regardless of how many brew sessions/devices you have.
  - title: Recipe & Metrics
    icon: mdi:cup-water
    cards:
      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Recipe Metrics
        filter:
          include:
            - entity_id: sensor.grainfather_*_target_abv
            - entity_id: sensor.grainfather_*_ibu
            - entity_id: sensor.grainfather_*_color_srm
            - entity_id: sensor.grainfather_*_calories
            - entity_id: sensor.grainfather_*_batch_size
            - entity_id: sensor.grainfather_*_boil_time
          exclude:
            - state: unknown
            - state: unavailable

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          title: Fermentation & Conditioning
        filter:
          include:
            - entity_id: sensor.grainfather_*_pre_boil_gravity
            - entity_id: sensor.grainfather_*_conditioning_temperature
            - entity_id: sensor.grainfather_*_conditioning_duration
            - entity_id: sensor.grainfather_*_ferment_volume
            - entity_id: sensor.grainfather_*_priming_sugar
          exclude:
            - state: unknown
            - state: unavailable

      # Controller target temperature plotted next to the measured temperature.
      # Both the measured `_temperature` and `_target_temperature` sensors carry
      # grainfather_entity_type: fermentation_device, while the brew-session
      # `_conditioning_temperature` sensor does not, so it is excluded here.
      - type: custom:auto-entities
        show_empty: false
        card:
          type: history-graph
          title: Controller Target vs. Measured Temperature
          hours_to_show: 48
        card_param: entities
        filter:
          include:
            - entity_id: sensor.grainfather_*_temperature
              attributes:
                grainfather_entity_type: fermentation_device

      # Recipe ingredients live as attributes on the per-session recipe_info
      # sensor. Point the entity below at one of your
      # sensor.grainfather_<session>_recipe_info sensors.
      - type: markdown
        title: Recipe Ingredients
        content: |-
          {% set s = 'sensor.grainfather_batch_01_recipe_info' %}
          {% set fermentables = state_attr(s, 'fermentables') or [] %}
          {% set grain_unit = fermentables | map(attribute='unit', default='') | reject('none') | reject('equalto', '') | first | default('') %}
          {% set hop_unit = {'kg': 'g', 'lb': 'oz'}.get(grain_unit, '') %}
          {% macro number(value, decimals) -%}
            {{- ('%.*f' | format(decimals, value | float) | replace('.', ',')) if is_number(value) else '—' -}}
          {%- endmacro %}
          {% macro metric(key, decimals, unit) -%}
            {%- set value = state_attr(s, key) -%}
            {{- (number(value, decimals) ~ ' ' ~ unit) if is_number(value) else '—' -}}
          {%- endmacro %}
          {% macro weight(item, decimals, fallback='', small=false) -%}
            {%- if item.amount is defined and is_number(item.amount) -%}
              {%- set value = item.amount | float -%}
              {%- set unit = item.unit | default(fallback, true) -%}
              {%- if small and 0 < value < 1 and unit == 'kg' -%}
                {%- set value, unit, decimals = value * 1000, 'g', 0 -%}
              {%- elif small and 0 < value < 1 and unit == 'lb' -%}
                {%- set value, unit, decimals = value * 16, 'oz', 1 -%}
              {%- endif -%}
              {{- ' — ' ~ number(value, decimals) ~ (' ' ~ unit if unit else '') -}}
            {%- endif -%}
          {%- endmacro %}

          ## {{ states(s) }}

          **ABV** {{ metric('abv', 1, '% vol') }} · **IBU** {{ metric('ibu', 0, 'IBU') }} · **SRM** {{ metric('srm', 1, 'SRM') }}

          ### Fermentables
          {% for f in fermentables -%}
          - {{ f.name }}{{ weight(f, 2, small=true) }}
          {% endfor %}

          ### Hops
          {% for h in state_attr(s, 'hops') or [] -%}
          - {{ h.name }}{{ weight(h, 1, hop_unit) }}
          {% endfor %}

          ### Yeasts
          {% for y in state_attr(s, 'yeasts') or [] -%}
          - {{ y.name }}
          {% endfor %}

          ### Mash steps
          {% for m in state_attr(s, 'mash_steps') or [] -%}
          - {{ m.name }}{% if m.temperature is defined and is_number(m.temperature) %} — {{ number(m.temperature, 1) }} °C{% endif %}{% if m.time is defined and is_number(m.time) %} / {{ number(m.time, 0) }} min{% endif %}
          {% endfor %}

